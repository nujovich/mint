name: Publish

on:
  push:
    tags:
      - 'v*'
  # Re-run the publish for an existing tag using the workflow from main.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v0.4.0)'
        required: true

permissions:
  contents: read
  id-token: write # required for build provenance (--provenance)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm test

      # Bypass-2FA tokens can only stage a publish; a maintainer approves it
      # with 2FA (`npm stage approve <stage-id>`) before it goes live.
      - name: Stage publish to npm
        run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
